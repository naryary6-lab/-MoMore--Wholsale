<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMore Collection - ហាងចេកកសិផលធម្មជាតិខ្មែរ</title>
  <style>
    :root {
      --banana-green: #2E7D32;
      --leaf-light: #4CAF50;
      --banana-yellow: #FFC107;
      --bg-color: #F1F8E9;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }
    body {
      font-family: 'Hanuman', 'Khmer OS Battambang', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, var(--banana-green), var(--leaf-light));
      color: white;
      text-align: center;
      padding: 20px;
      border-bottom: 4px solid var(--banana-yellow);
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      border-left: 5px solid var(--banana-green);
    }
    .product-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--banana-green);
      margin-bottom: 5px;
    }
    .product-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }
    .product-price {
      font-weight: bold;
      color: #D32F2F;
      margin-bottom: 10px;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-control button {
      background: var(--banana-green);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .qty-control span {
      font-weight: bold;
      font-size: 16px;
      min-width: 30px;
      text-align: center;
    }
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 15px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .total-display {
      font-size: 15px;
      font-weight: bold;
    }
    .order-btn {
      background: var(--banana-yellow);
      color: #333;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    /* Modal Pop-up Design */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border-top: 6px solid var(--banana-green);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h3 {
      margin-top: 0;
      color: var(--banana-green);
      text-align: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .summary-box {
      background: #F9FBE7;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      border: 1px dashed var(--banana-green);
    }
    .notice-box {
      background: #FFFDE7;
      border-left: 4px solid var(--banana-yellow);
      padding: 8px;
      font-size: 12px;
      color: #555;
      margin-bottom: 15px;
    }
    .modal-btns {
      display: flex;
      gap: 10px;
    }
    .modal-btns button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-confirm { background: var(--banana-green); color: white; }
    .btn-cancel { background: #ccc; color: #333; }
  </style>
</head>
<body>

  <header>
    <h1>🍌 MoMore Collection 🌿</h1>
    <p>ហាងលក់ដុំ និងរាយ ដំណាប់ចេកសាច់ទន់ និងចេកបំពងស្រួយធម្មជាតិខ្មែរ</p>
  </header>

  <div class="container" id="product-list" style="padding-bottom: 80px;">
    <!-- Product items will be loaded dynamically by JavaScript -->
  </div>

  <div class="footer-bar">
    <div class="total-display">សរុប: <span id="grand-total">0</span> ៛</div>
    <button class="order-btn" onclick="openModal()">ធ្វើការកុម្ម៉ង់ 🛒</button>
  </div>

  <!-- Modal Pop-up -->
  <div class="modal" id="order-modal">
    <div class="modal-content">
      <h3>បំពេញព័ត៌មានដឹកជញ្ជូន</h3>
      
      <div class="summary-box" id="modal-summary">
        <!-- Summary calculation here -->
      </div>

      <div class="notice-box">
        ⚠️ <strong>សម្គាល់ការទូទាត់៖</strong> ការទូទាត់ប្រាក់មុនម៉ោង 5:00 ល្ងាច នឹងត្រូវរៀបចំដាក់អីវ៉ាន់ជូនក្នុងថ្ងៃហ្នឹង។ បើលើសពីម៉ោង 5:00 ល្ងាច នឹងរៀបចំជូននៅថ្ងៃស្អែក។
      </div>

      <div class="form-group">
        <label>📞 លេខទូរស័ព្ទទំនាក់ទំនង៖</label>
        <input type="text" id="cust-phone" placeholder="បំពេញលេខទូរស័ព្ទរបស់អ្នក">
      </div>

      <div class="form-group">
        <label>📍 ខេត្ត/ក្រុង៖</label>
        <input type="text" id="cust-province" placeholder="ឧ. ខេត្តសៀមរាប, បាត់ដំបង...">
      </div>

      <div class="form-group">
        <label>🏢 សាខាក្រុមហ៊ុនដឹកជញ្ជូន (ឧ. សាខា វីរៈប៊ុនថាំ)：</label>
        <input type="text" id="cust-branch" placeholder="បំពេញឈ្មោះសាខាឱ្យបានច្បាស់លាស់">
      </div>

      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">បោះបង់</button>
        <button class="btn-confirm" onclick="submitOrder()">បញ្ជាក់ការកុម្ម៉ង់ 🚀</button>
      </div>
    </div>
  </div>

  <script>
    // ផលិតផលទាំង ១៧ មុខ រួមបញ្ចូលទាំងដំណាប់ចេកសាច់ទន់ និងចេកបំពងស្រួយ ព្រមទាំងព័ត៌មានថែទាំ
    const products = {
      1: { type: "ដំណាប់ចេកសាច់ទន់", flavor: ธรรมชาติ, size: "កំប៉ុងតូច", price: 15000, qty: 0, desc: "សាច់ទន់ស្រទន់ ផ្អែមធម្មជាតិ ជួយបំពេញថាមពលរាងកាយ។" },
      2: { type: "ដំណាប់ចេកសាច់ទន់", flavor: ងរអង, size: "កំប៉ុងធំ", price: 28000, qty: 0, desc: "ជំនួយដល់ប្រព័ន្ធរំលាយអាហារ និងស្បែកក្មេងជាងវ័យ។" },
      3: { type: "ដំណាប់ចេកសាច់ទន់", flavor: ពិសេស, size: "ប្រអប់កាដូ", price: 35000, qty: 0, desc: "ស័ក្តិសមសម្រាប់ធ្វើជាកាដូជូនពរក្នុងពិធីផ្សេងៗ។" },
      4: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិដើម, size: "ថุงកញ្ចប់", price: 10000, qty: 0, desc: "ស្រួយឆ្ងាញ់ មិនខ្លាញ់ ញ៉ាំជក់មាត់។" },
      5: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិប៊័របង្អែម", size: "ថุงកញ្ចប់", price: 12000, qty: 0, desc: "ក្លិនឈ្ងុយប៊័រធម្មជាតិ ឆ្ងាញ់ដាច់គេ។" },
      6: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិប្រៃស្រួយ", size: "ថุงកញ្ចប់", price: 12000, qty: 0, desc: "រសជាតិបែបប្រៃស្រួយ ត្រូវមាត់គ្រប់វ័យ។" },
      7: { type: "ដំណាប់ចេកសាច់ទន់", flavor: ងរអងពិសេស", size: "ថងស៊ីប", price: 20000, qty: 0, desc: "ងាយស្រួលវេចខ្ចប់ ទុកបានយូរ មិនងាយខូចគុណភាព។" },
      8: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិហឹរស្រាល", size: "ថងស៊ីប", price: 13000, qty: 0, desc: "រសជាតិជོារហឹរតិចៗ ញ៉ាំមិនបាច់ខ្លាចធាត់។" },
      9: { type: "ដំណាប់ចេកសាច់ទន់", flavor: បែបបុរាណ", size: "កំប៉ុងមធ្យម", price: 22000, qty: 0, desc: "រូបមន្តបុរាណ រក្សាជាតិដើម១០០%។" },
      10: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិញាក់ស្រួយ", size: "កំប៉ុងមធ្យម", price: 18000, qty: 0, desc: "ស្រួយខ្លាំង ពិសារពេលធ្វើការងារ ឬមើលកុន។" },
      11: { type: "ដំណាប់ចេកសាច់ទន់", flavor: លាយល្ង", size: "កំប៉ុងតូច", price: 16000, qty: 0, desc: "បន្ថែមគ្រាប់ល្ងស អសុខភាពបេះដូង និងឆ្អឹង។" },
      12: { type: "ចេកបំពងស្រួយ", flavor: ឈ្ងុយខារ៉ាមែល", size: "ថងស៊ីប", price: 15000, qty: 0, desc: "ស្រោបដោយខារ៉ាមែលផ្អែមស្រទន់ ឆ្ងាញ់ល្មម។" },
      13: { type: "ដំណាប់ចេកសាច់ទន់", flavor: ផ្អែមធម្មជាតិ", size: "គីឡូក្រាម", price: 45000, qty: 0, desc: "សម្រាប់លក់ដុំ ឬញ៉ាំគ្រួសារធំ ច្រើនសន្ធឹកសន្ធាប់។" },
      14: { type: "ចេកបំពងស្រួយ", flavor: ស្ងួតធម្មជាតិ", size: "ថងស៊ីប", price: 11000, qty: 0, desc: "គ្មានជាតិគីមី មិនដាក់ពណ៌បន្ថែម។" },
      15: { type: "ដំណាប់ចេកសាច់ទន់", flavor: សាច់មាស", size: "កំប៉ុងធំ", price: 30000, qty: 0, desc: "សាច់ចេកពណ៌មាសស្រស់ ស្រួយនិងទន់ល្មម។" },
      16: { type: "ចេកបំពងស្រួយ", flavor: រសជាតិខ្ទិះដូង", size: "ថងស៊ីប", price: 14000, qty: 0, desc: "ក្លិនឈ្ងុយខ្ទិះដូងដិតដួងចិត្ត។" },
      17: { type: "ដំណាប់ចេកសាច់ទន់", flavor: រូបមន្តពិសេសហាង", size: "ប្រអប់ធំ", price: 40000, qty: 0, desc: "រូបមន្តពិសេសប្រចាំហាង MoMore Collection។" }
    };

    function renderProducts() {
      const listEl = document.getElementById('product-list');
      listEl.innerHTML = "";
      for (let key in products) {
        let p = products[key];
        listEl.innerHTML += `
          <div class="product-card">
            <div class="product-title">${p.type} (${p.flavor} - ${p.size})</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-price">តម្លៃ: ${p.price.toLocaleString()} ៛</div>
            <div class="qty-control">
              <button onclick="changeQty(${key}, -1)">-</button>
              <span id="qty-${key}">${p.qty}</span>
              <button onclick="changeQty(${key}, 1)">+</button>
            </div>
          </div>
        `;
      }
    }

    function changeQty(id, delta) {
      products[id].qty += delta;
      if (products[id].qty < 0) products[id].qty = 0;
      document.getElementById(`qty-${id}`).innerText = products[id].qty;
      updateTotal();
    }

    function calculateTotal() {
      let totalItemPrice = 0;
      for (let key in products) {
        totalItemPrice += products[key].qty * products[key].price;
      }
      let shippingFee = totalItemPrice > 0 ? 5000 : 0; // ថ្លៃដឹកជញ្ជូនគំរូ ៥ពាន់រៀល (អាចកែសម្រួលបាន)
      let grandTotal = totalItemPrice + shippingFee;
      return { totalItemPrice, shippingFee, grandTotal };
    }

    function updateTotal() {
      let calc = calculateTotal();
      document.getElementById('grand-total').innerText = calc.grandTotal.toLocaleString();
    }

    function openModal() {
      let calc = calculateTotal();
      if (calc.totalItemPrice === 0) {
        alert("សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១ មុខសិន!");
        return;
      }
      
      document.getElementById('modal-summary').innerHTML = `
        📦 តម្លៃទំនិញសរុប: <b>${calc.totalItemPrice.toLocaleString()} ៛</b><br>
        🚚 សេវាដឹកជញ្ជូនរំពឹងទុក: <b>${calc.shippingFee.toLocaleString()} ៛</b><br>
        💰 <b>ទឹកប្រាក់សរុបត្រូវបង់ទាំងអស់: ${calc.grandTotal.toLocaleString()} ៛</b>
      `;
      
      document.getElementById('order-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    function submitOrder() {
      const phone = document.getElementById('cust-phone').value.trim();
      const province = document.getElementById('cust-province').value.trim();
      const branch = document.getElementById('cust-branch').value.trim();

      if (!phone || !province || !branch) {
        alert("សូមបំពេញ លេខទូរសព្ទ ខេត្ត និងឈ្មោះសាខាដឹកជញ្ជូន ឱ្យបានครบถ้วน!");
        return;
      }

      let calc = calculateTotal();

      let orderDetails = "🛍️ ══════════════════ 🛍️\n";
      orderDetails += "          📥 **សំណើកុម្ម៉ង់ទំនិញថ្មី (MoMore)**\n";
      orderDetails += "🛍️ ══════════════════ 🛍️\n\n";

      orderDetails += "📋 **បញ្ជីទំនិញដែលបានជ្រើសរើស៖**\n";
      for (let key in products) {
        if (products[key].qty > 0) {
          let p = products[key];
          orderDetails += `▪️ ${p.type} (${p.flavor} - ${p.size})\n`;
          orderDetails += `   👉 ចំនួន: ${p.qty} | ទឹកប្រាក់: ${(p.qty * p.price).toLocaleString()} ៛\n`;
        }
      }

      orderDetails += `\n📦 តម្លៃទំនិញ: ${calc.totalItemPrice.toLocaleString()} ៛\n`;
      orderDetails += `🚚 សេវាដឹកជញ្ជូន: ${calc.shippingFee.toLocaleString()} ៛\n`;
      orderDetails += `💰 **សរុបទឹកប្រាក់ត្រូវបង់:** ${calc.grandTotal.toLocaleString()} ៛\n`;
      orderDetails += "──────────────────────\n";
      orderDetails += "👤 **ព័ត៌មានអតិថិជន៖**\n";
      orderDetails += `📞 លេខទូរស័ព្ទ: ${phone}\n`;
      orderDetails += `📍 ខេត្ត/ក្រុង: ${province}\n`;
      orderDetails += `🏢 សាខា/ទីតាំង (វីរៈប៊ុនថាំ): ${branch}\n`;
      orderDetails += "──────────────────────\n";
      orderDetails += "⚠️ *សម្គាល់៖ ទូទាត់មុនម៉ោង 5:00 ល្ងាច ផ្ញើជូនថ្ងៃហ្នឹង! លើសពីហ្នឹងរៀបចំជូនថ្ងៃស្អែក។*";

      const encodedText = encodeURIComponent(orderDetails);
      const adminUsername = "MoMore_collection";
      
      window.open(`https://t.me/${adminUsername}?text=${encodedText}`, '_blank');
      closeModal();
    }

    // Initialize page
    renderProducts();
  </script>
