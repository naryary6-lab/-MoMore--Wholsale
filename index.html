<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMore Wholesale WebApp</title>
  <!-- Google Fonts: Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #f1c40f; /* ពណ៌លឿងមាស */
      --primary-dark: #d35400;   
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #000000;
      --text-gray: #555555;
      --price-red: #e74c3c;     
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
    
    body { background-color: var(--light-bg); color: var(--text-dark); padding-bottom: 140px; font-size: 14px; }
    
    header { background: #000; color: var(--primary); padding: 14px; text-align: center; font-weight: 800; font-size: 1.2rem; position: sticky; top: 0; z-index: 100; border-bottom: 4px solid var(--primary); }
    
    .container { max-width: 600px; margin: auto; padding: 16px 10px 10px 10px; }

    /* ពណ៌លឿងមាស អក្សរខ្មៅ ធំៗ សម្រាប់ចំណងជើងផ្នែកនីមួយៗ */
    .section-title-box { 
      margin: 22px 0 12px 0; 
      padding: 12px 14px; 
      background: var(--primary); 
      border-radius: 8px; 
      color: #000; 
      font-weight: 800; 
      font-size: 1.15rem; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; border: 1.5px solid #ddd; }
    .media-box { width: 100%; height: 240px; background-color: #f0f0f0; position: relative; }
    .media-box img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .row-1-type { font-size: 0.78rem; color: var(--text-gray); font-weight: 700; }
    .row-2-flavor { font-size: 0.95rem; font-weight: 800; margin: 2px 0 6px 0; line-height: 1.3; }
    .row-3-price-weight { display: flex; align-items: baseline; gap: 5px; margin-bottom: 8px; }
    .price-tag { font-size: 1.1rem; font-weight: 800; color: var(--price-red); }
    .weight-tag { font-size: 0.8rem; font-weight: 600; color: #444; background: #eee; padding: 2px 6px; border-radius: 4px;}
    
    .quantity-control { display: flex; align-items: center; justify-content: space-between; background: #f1f2f6; border-radius: 8px; padding: 4px 8px; }
    .btn-qty { width: 32px; height: 32px; background: white; border: 1.5px solid #ccc; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.1rem;}
    .qty-number { font-weight: 800; font-size: 1rem; }

    .coming-soon-card { background: #f9f9f9; border-radius: 12px; border: 2px dashed #bbb; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 330px; text-align: center; color: #888; padding: 20px; }
    
    .cart-bar { position: fixed; bottom: 22px; left: 12px; right: 12px; background: #000; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; max-width: 580px; margin: auto; border-radius: 12px; border: 2px solid var(--primary); z-index: 999; }
    .total-price { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .delivery-info { font-size: 0.75rem; color: #f1c40f; font-weight: 600; margin-top: 2px; }
    .btn-checkout { background: var(--primary); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1rem;}
    .btn-checkout:disabled { background: #555; color: #888; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 12px; overflow-y: auto;}
    .modal-content { width: 100%; max-width: 440px; background: #fff; border-radius: 12px; position: relative; display: flex; flex-direction: column; max-height: 95vh; }
    .close-modal { position: absolute; top: 10px; right: 10px; color: #000; font-size: 22px; font-weight: bold; cursor: pointer; z-index: 2001; background: var(--primary); width: 34px; height: 34px; border-radius: 50%; text-align: center; line-height: 32px; }
    
    .checkout-body { padding: 18px 16px; overflow-y: auto; background: #fafafa; }
    
    .btn-action { width: 100%; padding: 12px; border-radius: 8px; font-weight: 800; margin-top: 10px; border: none; cursor: pointer; font-size: 1rem; color: #000; }
    .btn-print { background: var(--primary); }
    .btn-telegram { background: #3498db; color: white; }
    .btn-close-preview { background: #e74c3c; color: white;}

    /* ទម្រង់វិក្កយបត្រថ្មី */
    .invoice-preview-card { background: white; padding: 15px; border-radius: 8px; color: #000; font-size: 14px; max-height: 65vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 1px solid #ddd;}
    .invoice-preview-card h2 { text-align: center; margin: 0 0 5px 0; font-weight: 800; font-size: 18px;}
    .invoice-preview-card hr { border: none; border-top: 1.5px dashed #000; margin: 10px 0; }
    
    /* ប្រអប់ Note សម្រាប់បុគ្គលិក Packing */
    .packing-note-box {
        background: #fff3cd;
        border: 2px solid #ffc107;
        border-radius: 8px;
        padding: 12px;
        margin-top: 15px;
        font-weight: 800;
        color: #856404;
        font-size: 15px;
        line-height: 1.6;
    }
    .packing-title { font-size: 16px; color: #000; margin-bottom: 5px; text-decoration: underline;}
  </style>
</head>
<body>

  <header>🍌 MOMORE WHOLESALE</header>

  <div class="container" id="dynamic-products-container">
    <!-- Products will be generated here -->
  </div>

  <div class="cart-bar">
    <div>
      <div style="font-size:0.75rem; color:#ccc; font-weight: 600;">សរុបសាច់ប្រាក់:</div>
      <div class="total-price"><span id="total-val">0</span> ៛</div>
      <div class="delivery-info" id="delivery-info">🚚 សេវាដឹក៖ 8,000 ៛</div>
    </div>
    <button class="btn-checkout" id="submit-btn" onclick="openCheckoutModal()">🛒 គិតលុយ</button>
  </div>

  <!-- Checkout Form Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeCheckoutModal()">&times;</span>
      <div class="checkout-body">
        <h3 style="margin-bottom: 15px; font-weight: 800; border-bottom: 2px solid var(--primary); padding-bottom: 5px;">📝 បំពេញព័ត៌មានអតិថិជន</h3>
        
        <div style="margin-bottom: 12px;">
          <label style="font-weight:700;">📞 លេខទូរស័ព្ទ / ឈ្មោះ ៖</label>
          <input type="text" id="cust-phone" placeholder="012 345 678 / ឈ្មោះ..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; margin-top:5px; font-size:15px;" required>
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-weight:700;">💳 ការទូទាត់ ៖</label>
          <select id="payment-status" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; margin-top:5px; font-size:15px; font-weight: bold;">
            <option value="COD (មិនទាន់វេរលុយ)">🔴 COD (មិនទាន់វេរលុយ)</option>
            <option value="PAID (វេរលុយរួច)">🟢 PAID (វេរលុយរួច)</option>
          </select>
        </div>

        <button class="btn-action btn-print" onclick="openInvoicePreview()">🧾 បង្កើតវិក្កយបត្រ (Preview)</button>
      </div>
    </div>
  </div>

  <!-- Invoice Preview Modal -->
  <div class="modal" id="invoiceModal">
    <div class="modal-content" style="background: #e2e8f0;">
      <div class="checkout-body">
        <h3 style="text-align: center; margin-bottom: 10px;">📄 ពិនិត្យវិក្កយបត្រ</h3>
        
        <div id="invoice-render-area" class="invoice-preview-card">
          <!-- Invoice HTML generated here -->
        </div>

        <button class="btn-action btn-telegram" onclick="sendToTelegram()">🚀 ផ្ញើចូល Telegram Admin</button>
        <button class="btn-action btn-close-preview" onclick="closeInvoiceModal()">ត្រឡប់ក្រោយ</button>
      </div>
    </div>
  </div>

  <script>
    /* ទិន្នន័យផលិតផល និងតម្លៃ (បច្ចុប្បន្នភាពតាមលក្ខខណ្ឌថ្មី) */
    const products = {
      // 1. ដំណាប់ចេក 200g
      D_ORIG200: { cat: 'CAT_1', type: "ដំណាប់ចេក", flavor: "រសជាតិដើម", price: 8000, qty: 0, size: '200g', id: 'd1_200' },

      D_MIXG200: { cat: 'CAT_1', type: "ដំណាប់ចេក", flavor: "រោយធញ្ញជាតិ", price: 10000, qty: 0, size: '200g', id: 'd4_200' },
      D_COCO200: { cat: 'CAT_1', type: "ដំណាប់ចេក", flavor: "រោយដូង", price: 10000, qty: 0, size: '200g', id: 'd5_200' },
      D_BALL200: { cat: 'CAT_1', type: "ដំណាប់ចេក", flavor: "ចេកមូល", price: 8000, qty: 0, size: '200g', id: 'd6_200' },

      // 2. ដំណាប់ចេក 1KG (តម្លៃនៅដដែល)
      D_ORIG1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "រសជាតិដើម", price: 40000, qty: 0, size: '1kg', id: 'd1_1kg' },
      D_SESM1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "រោយល្ងសខ្មៅ", price: 40000, qty: 0, size: '1kg', id: 'd2_1kg' },
      D_ALMD1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "រោយអាល់ម៉ុន", price: 50000, qty: 0, size: '1kg', id: 'd3_1kg' },
      D_MIXG1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "រោយធញ្ញជាតិ", price: 50000, qty: 0, size: '1kg', id: 'd4_1kg' },
      D_COCO1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "រោយដូង", price: 50000, qty: 0, size: '1kg', id: 'd5_1kg' },
      D_BALL1KG: { cat: 'CAT_2', type: "ដំណាប់ចេក", flavor: "ចេកមូល", price: 40000, qty: 0, size: '1kg', id: 'd6_1kg' },

      // 3. ដំណាប់ចេក 5KG (តម្លៃបញ្ចុះពេលទិញ 5kg: ល្ង/មូល/ដើម=35k/kg, អាល់ម៉ុន/ធញ្ញជាតិ/ដូង=45k/kg)
      D_ORIG5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "រសជាតិដើម", price: 175000, qty: 0, size: '5kg', id: 'd1_1kg' },
      D_SESM5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "រោយល្ងសខ្មៅ", price: 175000, qty: 0, size: '5kg', id: 'd2_1kg' },
      D_ALMD5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "រោយអាល់ម៉ុន", price: 225000, qty: 0, size: '5kg', id: 'd3_1kg' },
      D_MIXG5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "រោយធញ្ញជាតិ", price: 225000, qty: 0, size: '5kg', id: 'd4_1kg' },
      D_COCO5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "រោយដូង", price: 225000, qty: 0, size: '5kg', id: 'd5_1kg' },
      D_BALL5KG: { cat: 'CAT_3', type: "ដំណាប់ចេក", flavor: "ចេកមូល", price: 175000, qty: 0, size: '5kg', id: 'd6_1kg' },

      // 4. ដំណាប់ចេកសូកូឡា 300g
      D_RCHCS300: { cat: 'CAT_4', type: "ដំណាប់ចេក", flavor: "សូកូឡាស្នូលដូង", price: 17000, qty: 0, size: '300g', id: 'd7_300' },
      D_RCHCC300: { cat: 'CAT_4', type: "ដំណាប់ចេក", flavor: "សូកូឡាស្នូលចន្ទី", price: 17000, qty: 0, size: '300g', id: 'd8_300' },

      // 5. ចេកបំពង 200g
      C_CHOC200: { cat: 'CAT_5', type: "ចេកបំពងស្រួយ", flavor: "សូកូឡាទឹកដោះគោ", price: 10000, qty: 0, size: '200g', id: 'b1_200' },
      C_CHES200: { cat: 'CAT_5', type: "ចេកបំពងស្រួយ", flavor: "ឈីស ទឹកដោះគោ", price: 10000, qty: 0, size: '200g', id: 'b2_200' },
      C_BBQ200: { cat: 'CAT_5', type: "ចេកបំពងស្រួយ", flavor: "បាប៊ីឃ្យូ BBQ", price: 10000, qty: 0, size: '200g', id: 'b3_200' },
      C_SPIC200: { cat: 'CAT_5', type: "ចេកបំពងស្រួយ", flavor: "ម្ទេសខ្ទឹម", price: 10000, qty: 0, size: '200g', id: 'b4_200' },

      // 6. ចេកបំពង 100g
      C_CHOC100: { cat: 'CAT_6', type: "ចេកបំពងស្រួយ", flavor: "សូកូឡាទឹកដោះគោ", price: 5000, qty: 0, size: '100g', id: 'b1_100' },
      C_CHES100: { cat: 'CAT_6', type: "ចេកបំពងស្រួយ", flavor: "ឈីស ទឹកដោះគោ", price: 5000, qty: 0, size: '100g', id: 'b2_100' },
      C_BBQ100: { cat: 'CAT_6', type: "ចេកបំពងស្រួយ", flavor: "បាប៊ីឃ្យូ BBQ", price: 5000, qty: 0, size: '100g', id: 'b3_100' },
      C_SPIC100: { cat: 'CAT_6', type: "ចេកបំពងស្រួយ", flavor: "ម្ទេសខ្ទឹម", price: 5000, qty: 0, size: '100g', id: 'b4_100' },

      // 7. ចេកបំពងរសជាតិដើម (សាបស្រួយ)
      C_PLAIN250: { cat: 'CAT_7', type: "ចេកបំពងស្រួយ", flavor: "រសជាតិដើមសាប", price: 5000, qty: 0, size: '250g', id: 'b5_250' },
      C_PLAIN500: { cat: 'CAT_7', type: "ចេកបំពងស្រួយ", flavor: "រសជាតិដើមសាប", price: 10000, qty: 0, size: '500g', id: 'b5_500' },
      C_PLAIN1KG: { cat: 'CAT_7', type: "ចេកបំពងស្រួយ", flavor: "រសជាតិដើមសាប", price: 20000, qty: 0, size: '1kg', id: 'b5_1kg' }
    };

    const categoriesConfig = [
      { id: 'CAT_1', title: '1. DAMNAB NAMWA 200G' },
      { id: 'CAT_2', title: '2. DAMNAB NAMWA 1KG' },
      { id: 'CAT_3', title: '3. DAMNAB NAMWA 5KG' },
      { id: 'CAT_4', title: '4. DAMNAB CHOCOLATE 300G' },
      { id: 'CAT_5', title: '5. CRISPY BANANA 200G' },
      { id: 'CAT_6', title: '6. CRISPY BANANA 100G' },
      { id: 'CAT_7', title: '7. CRISPY PLAIN' }
    ];

    function renderDynamicProducts() {
      const mainContainer = document.getElementById('dynamic-products-container');
      mainContainer.innerHTML = '';

      categoriesConfig.forEach(cat => {
        let itemsHtml = '';
        let itemCount = 0;

        for (let key in products) {
          if (products[key].cat === cat.id) {
            let p = products[key];
            itemsHtml += `
              <div class="product-card">
                <div class="media-box">
                  <img src="${p.id}.jpg" alt="${p.flavor}" onerror="this.onerror=null; this.src='https://via.placeholder.com/250x320/f0f0f0/888?text=Image'">
                </div>
                <div class="product-info">
                  <div>
                    <div class="row-1-type">${p.type}</div>
                    <div class="row-2-flavor">${p.flavor}</div>
                    <div class="row-3-price-weight">
                      <span class="price-tag">${p.price.toLocaleString()}៛</span>
                      <span class="weight-tag">${p.size}</span>
                    </div>
                  </div>
                  <div class="quantity-control">
                    <button class="btn-qty" onclick="changeQty('${key}', -1)">-</button>
                    <span class="qty-number" id="qty-${key}">${p.qty}</span>
                    <button class="btn-qty" onclick="changeQty('${key}', 1)">+</button>
                  </div>
                </div>
              </div>
            `;
            itemCount++;
          }
        }

        if (itemCount > 0) {
          if (itemCount % 2 !== 0) {
            itemsHtml += `
              <div class="product-card">
                <div class="coming-soon-card">
                  <span style="font-size: 2.5rem;">🍌</span>
                  <h3 style="color:#333; margin-top:10px;">MOMORE</h3>
                  <p style="font-size: 0.8rem; margin-top: 5px;">Coming Soon</p>
                </div>
              </div>
            `;
          }
          mainContainer.innerHTML += `
            <div class="section-title-box">${cat.title}</div>
            <div class="grid">${itemsHtml}</div>
          `;
        }
      });
    }

    function changeQty(key, amount) {
      products[key].qty += amount;
      if (products[key].qty < 0) products[key].qty = 0;
      document.getElementById(`qty-${key}`).innerText = products[key].qty;
      calculateTotal();
    }

    function calculateTotal() {
      let foodTotal = 0;
      let d200 = 0, d1kg = 0, d5kg = 0, c200 = 0, c100 = 0, d300 = 0;

      for (let key in products) {
        let p = products[key];
        foodTotal += p.qty * p.price;
        
        if (p.cat === 'CAT_1') d200 += p.qty;
        if (p.cat === 'CAT_2') d1kg += p.qty;
        if (p.cat === 'CAT_3') d5kg += p.qty; // 1 pack = 5kg
        if (p.cat === 'CAT_4') d300 += p.qty;
        if (p.cat === 'CAT_5') c200 += p.qty;
        if (p.cat === 'CAT_6') c100 += p.qty;
      }

      let deliveryFee = 8000;
      let bonuses = [];
      let isFreeShipping = false;
      
      // Tracking variables for Packing Note
      let free200g = 0;
      let free100g = 0;
      let freeKg = 0;

      // 1. ដំណាប់ចេក 200g (ទិញ 10 ថែម 2 | 30 ថែម 6)
      if (d200 >= 30) {
        isFreeShipping = true;
        free200g = Math.floor(d200 / 30) * 6;
        bonuses.push(`ទិញ 200g ${d200}ប្រអប់ ថែម 🎁 ${free200g}ប្រអប់`);
      } else if (d200 >= 10) {
        free200g = Math.floor(d200 / 10) * 2;
        bonuses.push(`ទិញ 200g ${d200}ប្រអប់ ថែម 🎁 ${free200g}ប្រអប់`);
      }

      // 2. ដំណាប់ចេក គីឡូ (1kg & 5kg)
      let totalDamnabKg = d1kg + (d5kg * 5);
      if (totalDamnabKg >= 10) {
        isFreeShipping = true;
        freeKg = Math.floor(totalDamnabKg / 5) * 1; 
        bonuses.push(`ទិញ 1kg/5kg សរុប ${totalDamnabKg}kg ថែម 🎁 ${freeKg}kg`);
      } else if (totalDamnabKg >= 5) {
        freeKg = 1;
        bonuses.push(`ទិញ 1kg/5kg សរុប ${totalDamnabKg}kg ថែម 🎁 1kg`);
      } else if (totalDamnabKg >= 1 && totalDamnabKg < 5) {
        let freeKham = totalDamnabKg * 2; // 1kg = 2ខាំ
        bonuses.push(`ទិញ ${totalDamnabKg}kg ថែម 🎁 ${freeKham}ខាំ (0.${freeKham}kg)`);
        freeKg = freeKham / 10;
      }

      // 3. ចេកបំពង (200g & 100g)
      let totalCrispyBoxes = c200 + c100;
      if (c200 >= 30 && c100 === 0) {
        isFreeShipping = true; free200g += 1; bonuses.push(`ចេកបំពង 200g ថែម 🎁 1ប្រអប់`);
      } else if (c100 >= 60 && c200 === 0) {
        isFreeShipping = true; free100g += 2; bonuses.push(`ចេកបំពង 100g ថែម 🎁 2ប្រអប់`);
      } else if (totalCrispyBoxes >= 60) {
        isFreeShipping = true; free200g += 1; bonuses.push(`លាយចេកបំពង 60ប្រអប់ ថែម 🎁 200g (1ប្រអប់)`);
      } else if (totalCrispyBoxes >= 30) {
        isFreeShipping = true; bonuses.push(`លាយចេកបំពង 30ប្រអប់ (Free សេវាដឹក)`);
      }

      if (isFreeShipping || foodTotal === 0) deliveryFee = 0;

      let grandTotal = foodTotal + deliveryFee;
      document.getElementById('total-val').innerText = grandTotal.toLocaleString();
      
      const delBox = document.getElementById('delivery-info');
      delBox.innerText = deliveryFee === 0 && foodTotal > 0 ? `🚚 សេវាដឹក៖ FREE ឥតគិតថ្លៃ!` : `🚚 សេវាដឹក៖ ${deliveryFee.toLocaleString()} ៛`;

      // គណនាសម្រាប់ Packing Note
      let pack_total200g = d200 + c200 + free200g;
      let pack_total100g = c100 + free100g;
      let pack_total300g = d300;
      let pack_totalKg = totalDamnabKg + freeKg;

      return { grandTotal, foodTotal, deliveryFee, bonuses, pack_total200g, pack_total100g, pack_total300g, pack_totalKg };
    }

    function openCheckoutModal() {
      let calc = calculateTotal();
      if (calc.foodTotal === 0) return;
      document.getElementById('checkoutModal').style.display = 'flex';
    }
    function closeCheckoutModal() { document.getElementById('checkoutModal').style.display = 'none'; }
    function closeInvoiceModal() { document.getElementById('invoiceModal').style.display = 'none'; }

    // បង្ហាញ Invoice តាមទម្រង់ដែលបងចង់បាន
    function openInvoicePreview() {
      let calc = calculateTotal();
      const phone = document.getElementById('cust-phone').value.trim();
      const status = document.getElementById('payment-status').value;
      
      if (!phone) { alert("សូមបញ្ចូលលេខទូរស័ព្ទ / ឈ្មោះ!"); return; }

      const d = new Date();
      let printDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes()}`;
      
      let html = `
        <h2>MOMORE WHOLESALE</h2>
        <p style="text-align:center; font-weight:bold; margin-bottom:10px;">Tel: 066 895 789</p>
        <hr>
        <p style="font-weight:700;">កាលបរិច្ឆេទ: ${printDate}<br>ភ្ញៀវ: <span style="color:var(--primary-dark);">${phone}</span><br>ការទូទាត់: ${status}</p>
        <hr>
      `;
      
      for (let key in products) {
        if (products[key].qty > 0) {
          let p = products[key];
          let rowTotal = p.price * p.qty;
          
          html += `
            <div style="margin-bottom: 12px; font-weight: 700;">
               <div style="display:flex; justify-content:space-between;">
                  <span>- ${p.flavor} ${p.size}</span>
                  <span style="font-size: 15px;">${rowTotal.toLocaleString()}៛</span>
               </div>
               <div style="display:flex; justify-content:space-between; color:#555; font-size:13px; font-weight: 600; padding-left: 10px;">
                  <span>(${p.qty} ប្រអប់/កញ្ចប់ x ${p.price.toLocaleString()}៛)</span>
               </div>
            </div>
          `;
        }
      }
      
      html += `<hr>`;
      
      html += `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:700;">
          <span>សេវាដឹកជញ្ជូន:</span>
          <span>${calc.deliveryFee === 0 ? 'FREE (0៛)' : calc.deliveryFee.toLocaleString()+'៛'}</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.3rem; margin-top:10px;">
          <span>សរុបទាំងអស់:</span>
          <span>${calc.grandTotal.toLocaleString()} ៛</span>
        </div>
      `;
      
      if(calc.bonuses.length > 0) {
        html += `<div style="margin-top:15px; font-weight:800; font-size:13px; color:var(--primary-dark);">`;
        calc.bonuses.forEach(b => { html += `<div>${b}</div>`; });
        html += `</div>`;
      }
      
      // ប្រអប់ Note សម្រាប់រៀបចំ (Packing Note) ធំច្បាស់
      html += `
        <div class="packing-note-box">
           <div class="packing-title">Note: សរុបផលិតផលទាំងអស់ +Pro 🎁</div>
           <ul style="margin-left: 20px; margin-top: 5px;">
      `;
      if (calc.pack_total200g > 0) html += `<li>ប្រអប់ (200g) = <b>${calc.pack_total200g} ប្រអប់</b></li>`;
      if (calc.pack_total100g > 0) html += `<li>ប្រអប់ (100g) = <b>${calc.pack_total100g} ប្រអប់</b></li>`;
      if (calc.pack_total300g > 0) html += `<li>ប្រអប់ (300g) = <b>${calc.pack_total300g} ប្រអប់</b></li>`;
      if (calc.pack_totalKg > 0) html += `<li>សរុបគីឡូ = <b>${calc.pack_totalKg} kg</b></li>`;
      html += `</ul></div>`;

      document.getElementById('invoice-render-area').innerHTML = html;
      document.getElementById('checkoutModal').style.display = 'none';
      document.getElementById('invoiceModal').style.display = 'flex';
    }

    // មុខងារចម្លងទៅ Telegram
    function sendToTelegram() {
      let calc = calculateTotal();
      const phone = document.getElementById('cust-phone').value;
      const status = document.getElementById('payment-status').value;
      
      let text = `🛍️ MOMORE WHOLESALE\n📞 ភ្ញៀវ: ${phone}\n💳 ទូទាត់: ${status}\n\n`;
      
      for (let key in products) {
        if (products[key].qty > 0) {
          text += `- ${products[key].flavor} ${products[key].size} | ${(products[key].price * products[key].qty).toLocaleString()}៛\n  (${products[key].qty} x ${products[key].price.toLocaleString()}៛)\n`;
        }
      }
      
      text += `\n🚚 សេវាដឹក: ${calc.deliveryFee === 0 ? 'FREE' : calc.deliveryFee.toLocaleString()+' ៛'}\n`;
      text += `💰 សរុបទាំងអស់: ${calc.grandTotal.toLocaleString()} ៛\n`;
      
      if(calc.bonuses.length > 0) {
        text += `\n🎁 ប្រូម៉ូសិន:\n${calc.bonuses.join('\n')}\n`;
      }

      text += `\n📦 Note រៀបអីវ៉ាន់:\n- 200g = ${calc.pack_total200g} ប្រអប់\n- 100g = ${calc.pack_total100g} ប្រអប់\n- គីឡូ = ${calc.pack_totalKg} kg`;

      const encodedText = encodeURIComponent(text);
      window.open(`https://t.me/MoMore_collection?text=${encodedText}`, '_blank');
    }

    renderDynamicProducts();
  </script>
