<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momore Banana - ហាងលក់រាយ & ប្រូម៉ូសិន</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #f39c12;
      --primary-dark: #d35400;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --price-red: #e74c3c;
      --text-dark: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
    body { background-color: var(--light-bg); color: var(--text-dark); padding-bottom: 140px; }
    
    header { 
      background: #121212; 
      color: var(--primary); 
      padding: 12px; 
      text-align: center; 
      font-weight: 700; 
      font-size: 1.2rem; 
      position: sticky; top: 0; z-index: 100;
      border-bottom: 2px solid var(--primary);
    }
    
    .container { max-width: 600px; margin: auto; padding: 10px; }

    /* Cover / Hero Banner */
    .hero-banner {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('banner_cover.jpg') center/cover no-repeat;
      background-color: #222;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      color: white;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .hero-title { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .hero-subtitle { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }

    /* Video Gallery Section */
    .video-section {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 15px;
      border: 1px solid #e2e2e2;
    }
    .video-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-top: 8px; }
    .video-tab-btn {
      background: #f1f2f6;
      border: 1px solid #ccc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .video-tab-btn.active { background: var(--primary); color: #121212; border-color: var(--primary); }

    .video-grid { display: flex; gap: 10px; overflow-x: auto; padding: 6px 0; }
    .video-card-thumb {
      min-width: 130px;
      height: 170px;
      background: #111;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      border: 1px solid #333;
    }
    .video-card-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .video-card-title {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.8); color: #fff;
      font-size: 0.7rem; padding: 4px 6px; text-align: center;
      line-height: 1.2;
    }
    .play-icon-center {
      position: absolute; top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.6rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    /* Retail Product Section Grid */
    .section-title { font-size: 1.1rem; font-weight: 700; margin: 15px 0 8px 0; color: #121212; border-left: 4px solid var(--primary); padding-left: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .product-card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e0e0e0;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .media-box { width: 100%; height: 200px; background: #121212; position: relative; }
    .media-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .product-info { padding: 8px 10px; }
    .row-1-type { font-size: 0.78rem; color: #666; }
    .row-2-flavor { font-size: 0.95rem; font-weight: 700; color: #121212; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-3-price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
    .price-tag { font-size: 1.1rem; font-weight: 700; color: var(--price-red); }
    .weight-tag { font-size: 0.75rem; color: #777; }

    .quantity-control { display: flex; align-items: center; justify-content: space-between; background: #f1f2f6; border-radius: 8px; padding: 2px 4px; }
    .btn-qty { width: 28px; height: 28px; background: white; border: 1px solid #ccc; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Modal Video Player with Related Feed */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
    .modal-video-container { width: 100%; max-width: 450px; height: 92vh; background: #000; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .close-modal { position: absolute; top: 10px; right: 12px; color: white; font-size: 22px; cursor: pointer; z-index: 2001; background: rgba(0,0,0,0.6); width: 32px; height: 32px; border-radius: 50%; text-align: center; line-height: 30px; }
    
    .main-video-player { width: 100%; height: 65%; background: #000; }
    .main-video-player video { width: 100%; height: 100%; object-fit: contain; }

    .related-videos-zone { height: 35%; background: #121212; padding: 10px; overflow-y: auto; color: white; }
    .related-title { font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .related-list { display: flex; gap: 8px; overflow-x: auto; }
    .related-item { min-width: 95px; height: 115px; background: #222; border-radius: 8px; position: relative; overflow: hidden; cursor: pointer; flex-shrink: 0; }
    .related-item video { width: 100%; height: 100%; object-fit: cover; }

    /* Bottom Cart Bar */
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: auto; border-top: 2px solid var(--primary); z-index: 999; }
    .btn-checkout { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>🍌 MOMORE - ហាងលក់រាយ</header>

  <div class="container">
    
    <!-- Cover Page / Banner -->
    <div class="hero-banner">
      <div class="hero-title">ចេកបំពង & ដំណាប់ចេក ម៉ូម័រ</div>
      <div class="hero-subtitle">សាច់ទន់ស្វិត ស្រួយឆ្ងាញ់ អនាម័យខ្ពស់</div>
    </div>

    <!-- Video Gallery Zone -->
    <div class="video-section">
      <div style="font-weight:700; font-size:0.95rem;">🎬 មើលវីដេអូតាមផ្នែក (Video Feed)</div>
      <div class="video-tabs">
        <button class="video-tab-btn active" onclick="filterVideos('all', event)">ទាំងអស់</button>
        <button class="video-tab-btn" onclick="filterVideos('promo', event)">🔥 ប្រូម៉ូសិន (PROMO)</button>
        <button class="video-tab-btn" onclick="filterVideos('eat', event)">😋 វីដេអូញ៉ាំ (EAT)</button>
        <button class="video-tab-btn" onclick="filterVideos('prod', event)">🍌 ផលិតផល (PROD)</button>
        <button class="video-tab-btn" onclick="filterVideos('b2b', event)">🤝 B2B / ដេប៉ូ</button>
        <button class="video-tab-btn" onclick="filterVideos('rev', event)">⭐ Review ទីផ្សារ</button>
        <button class="video-tab-btn" onclick="filterVideos('proc', event)">🧼 សង្វាក់ផលិតកម្ម</button>
      </div>

      <div class="video-grid" id="video-feed">
        <!-- Render វីដេអូដោយ JavaScript -->
      </div>
    </div>

    <!-- បញ្ជីផលិតផល -->
    <div class="section-title">🍌 ផលិតផលលក់រាយ</div>
    <div class="grid" id="retail-products"></div>

  </div>

  <!-- Video Player Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-video-container">
      <span class="close-modal" onclick="closeVideoModal()">&times;</span>
      
      <div class="main-video-player">
        <video id="activeVideo" controls autoplay style="width:100%; height:100%;"></video>
      </div>

      <div class="related-videos-zone">
        <div class="related-title">📺 វីដេអូផ្សេងទៀតក្នុងផ្នែកនេះ៖</div>
        <div class="related-list" id="related-list"></div>
      </div>
    </div>
  </div>

  <!-- Cart Bar -->
  <div class="cart-bar">
    <div>
      <div style="font-size:0.75rem; color:#aaa;">សរុបសាច់ប្រាក់:</div>
      <div style="font-size:1.2rem; font-weight:700; color:var(--primary);"><span id="total-val">0</span> ៛</div>
    </div>
    <button class="btn-checkout" onclick="alert('ប្រព័ន្ធលក់រាយ៖ សូមបំពេញព័ត៌មានដឹកជញ្ជូន!')">បញ្ជាទិញរាយ</button>
  </div>

  <script>
    // បញ្ជីវីដេអូទាំងអស់ដែលដកស្រង់ចេញពី File ជាក់ស្តែងរបស់អ្នក
    const videoData = [
      // PROMO Videos
      { id: 'promo1', cat: 'promo', title: 'PROMO 001', src: 'PROMO-001.mp4' },
      { id: 'promo2', cat: 'promo', title: 'PROMO 002', src: 'PROMO-002.mp4' },
      { id: 'promo3', cat: 'promo', title: 'PROMO 003', src: 'PROMO-003.mp4' },
      { id: 'promo4', cat: 'promo', title: 'PROMO 004', src: 'PROMO-004.mp4' },
      { id: 'promo5', cat: 'promo', title: 'PROMO 005', src: 'PROMO-005.mp4' },
      { id: 'promo6', cat: 'promo', title: 'PROMO 006', src: 'PROMO-006.mp4' },
      { id: 'promo7', cat: 'promo', title: 'PROMO 007', src: 'PROMO-007.mp4' },
      { id: 'promo8', cat: 'promo', title: 'PROMO 008', src: 'PROMO-008.mp4' },
      { id: 'promo9', cat: 'promo', title: 'PROMO 009', src: 'PROMO-009.mp4' },

      // EAT / Mukbang Videos
      { id: 'eat1', cat: 'eat', title: 'EAT Mukbang 1', src: 'EAT-MUKBANG-001.mp4' },
      { id: 'eat2', cat: 'eat', title: 'EAT Mukbang 2', src: 'EAT-MUKBANG-002.mp4' },
      { id: 'eat3', cat: 'eat', title: 'EAT Mukbang 3', src: 'EAT-MUKBANG-003.mp4' },
      { id: 'eat4', cat: 'eat', title: 'EAT Mukbang 4', src: 'EAT-MUKBANG-004.mp4' },
      { id: 'eat5', cat: 'eat', title: 'EAT Mukbang 5', src: 'EAT-MUKBANG-005.mp4' },

      // PROD / Product Showcase Videos
      { id: 'prod1', cat: 'prod', title: 'PROD 001', src: 'PROD-001.mp4' },
      { id: 'prod2', cat: 'prod', title: 'PROD 002', src: 'PROD-002.mp4' },
      { id: 'prod3', cat: 'prod', title: 'PROD 003', src: 'PROD-003.mp4' },
      { id: 'prod4', cat: 'prod', title: 'PROD 004', src: 'PROD-004.mp4' },
      { id: 'prod5', cat: 'prod', title: 'PROD 005', src: 'PROD-005.mp4' },

      // B2B Videos
      { id: 'b2b1', cat: 'b2b', title: 'B-TO-B 001', src: 'B-TO-B-001.mp4' },
      { id: 'b2b2', cat: 'b2b', title: 'B-TO-B 002', src: 'B-TO-B-002.mp4' },
      { id: 'b2b3', cat: 'b2b', title: 'B-TO-B 003', src: 'B-TO-B-003.mp4' },
      { id: 'b2b4', cat: 'b2b', title: 'B-TO-B 004', src: 'B-TO-B-004.mp4' },

      // REV / Market Review Videos
      { id: 'rev1', cat: 'rev', title: 'REV Market 1', src: 'REV-MARKET-001.mp4' },
      { id: 'rev2', cat: 'rev', title: 'REV Market 2', src: 'REV-MARKET-002.mp4' },
      { id: 'rev3', cat: 'rev', title: 'REV Market 3', src: 'REV-MARKET-003.mp4' },

      // Process Videos
      { id: 'proc1', cat: 'proc', title: 'PROC 001', src: 'PROC-001.mp4' }
    ];

    // ទិន្នន័យផលិតផល
    const retailProducts = {
      R1: { type: "ចេកបំពងស្រួយ", flavor: "ឈីស ដោះគោ", price: 5000, size: "100g", img: "cheese100g.jpg" },
      R2: { type: "ចេកបំពងស្រួយ", flavor: "ម្ទេសខ្ទឹម", price: 14000, size: "200g", img: "garlic200g.jpg" },
      R3: { type: "ចេកបំពងស្រួយ", flavor: "ម្ទេសខ្ទឹម", price: 5000, size: "100g", img: "garlic100g.jpg" },
      R4: { type: "ចេកបំពងស្រួយ", flavor: "រសជាតិបាប៊ីឃ្យូ BBQ", price: 10000, size: "200g", img: "bbq200g.jpg" }
    };

    function renderVideoFeed(filter = 'all') {
      const feed = document.getElementById('video-feed');
      feed.innerHTML = '';
      
      const filtered = filter === 'all' ? videoData : videoData.filter(v => v.cat === filter);
      
      filtered.forEach(v => {
        feed.innerHTML += `
          <div class="video-card-thumb" onclick="openVideoPlayer('${v.id}')">
            <video src="${v.src}#t=0.5" preload="metadata" muted></video>
            <div class="play-icon-center">▶️</div>
            <div class="video-card-title">${v.title}</div>
          </div>
        `;
      });
    }

    function filterVideos(cat, event) {
      document.querySelectorAll('.video-tab-btn').forEach(b => b.classList.remove('active'));
      if(event) event.target.classList.add('active');
      renderVideoFeed(cat);
    }

    function openVideoPlayer(videoId) {
      const v = videoData.find(item => item.id === videoId);
      if (!v) return;

      const player = document.getElementById('activeVideo');
      player.src = v.src;
      
      // បង្ហាញ Related Videos នៅក្នុង Category ដូចគ្នា
      const relatedList = document.getElementById('related-list');
      relatedList.innerHTML = '';
      
      videoData.filter(item => item.cat === v.cat && item.id !== videoId).forEach(rel => {
        relatedList.innerHTML += `
          <div class="related-item" onclick="openVideoPlayer('${rel.id}')">
            <video src="${rel.src}#t=0.5" preload="metadata" muted></video>
            <div style="position:absolute; bottom:0; background:rgba(0,0,0,0.85); font-size:0.6rem; color:#fff; width:100%; text-align:center; padding:2px;">${rel.title}</div>
          </div>
        `;
      });

      document.getElementById('videoModal').style.display = 'flex';
      player.play().catch(e => console.log("មិនអាច Play វីដេអូបានទេ"));
    }

    function closeVideoModal() {
      const player = document.getElementById('activeVideo');
      player.pause();
      document.getElementById('videoModal').style.display = 'none';
    }

    function renderRetailProducts() {
      const container = document.getElementById('retail-products');
      container.innerHTML = '';
      for (let key in retailProducts) {
        let p = retailProducts[key];
        container.innerHTML += `
          <div class="product-card">
            <div class="media-box">
              <img src="${p.img}" onerror="this.src='https://via.placeholder.com/200x200/121212/f39c12?text=MoMore'">
            </div>
            <div class="product-info">
              <div class="row-1-type">${p.type}</div>
              <div class="row-2-flavor">${p.flavor}</div>
              <div class="row-3-price">
                <span class="price-tag">${p.price.toLocaleString()} ៛</span>
                <span class="weight-tag">(${p.size})</span>
              </div>
              <div class="quantity-control">
                <button class="btn-qty">-</button>
                <span style="font-weight:700;">0</span>
                <button class="btn-qty">+</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Run Initial State
    renderVideoFeed();
    renderRetailProducts();
  </script>
</body>
</html>
