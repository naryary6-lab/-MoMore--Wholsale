<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចេកស្អិត ដំណាប់ចេកខ្មែរ - MoMore</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg-dark: #120303; 
      --gold-bright: #FFE600; 
      --yellow-soft: #FFF275; 
      --red-bright: #FF0000;  
      --green-bright: #00FF66;
      --badge-bg: #800000;
      --btn-preview-grad: linear-gradient(135deg, #FF9900, #FF5500); 
      --btn-print-grad: linear-gradient(135deg, #00C9FF, #92FE9D);   
      --btn-telegram-grad: linear-gradient(135deg, #0088cc, #005580);
    }
    * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
    body { background-color: var(--bg-dark); color: #fff; margin: 0; padding-bottom: 140px; font-size: 16px; }
    
    /* Header System */
    .header { text-align: center; padding: 18px 10px; background: linear-gradient(180deg, #4A0000, #120303); border-bottom: 3px solid var(--gold-bright); }
    .header .brand-title { font-size: 15px; font-weight: 700; color: var(--gold-bright); margin: 0 0 5px 0; }
    .header .subtitle-1 { font-size: 29px; font-weight: 900; color: #FFF5e6; margin: 0 0 5px 0; }
    .header .subtitle-2 { font-size: 18px; font-weight: 900; color: var(--green-bright); margin: 0 0 8px 0; }
    .header .contact-info { font-size: 16px; color: #FFF; font-weight: 900; line-height: 1.6; }

    /* Switch Wholesale / Retail */
    .switch-container { display: flex; margin: 15px; background: #000; border-radius: 30px; border: 3px solid var(--gold-bright); padding: 4px; }
    .switch-btn { flex: 1; padding: 12px; border: none; border-radius: 25px; background: transparent; color: #fff; font-weight: 900; cursor: pointer; font-size: 18px; }
    .switch-btn.active-retail { background: var(--red-bright); color: #FFF; }
    .switch-btn.active-wholesale { background: #008CBA; color: #FFF; }

    /* Section Header */
    .section-header { 
      background: linear-gradient(135deg, #3d0303, #6b0000); 
      color: var(--gold-bright); 
      font-size: 20px; 
      font-weight: 900; 
      padding: 12px 16px; 
      margin: 20px 10px 12px 10px; 
      border-left: 8px solid var(--gold-bright);
      border-right: 2px solid var(--gold-bright);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(255, 230, 0, 0.25);
    }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 0 10px; }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card { background: #1C0202; border: 2px solid var(--gold-bright); border-radius: 10px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-info { flex: 1; padding-right: 8px; }
    .card-category { font-size: 15px; font-weight: 900; color: var(--yellow-soft); } 
    .card-title { font-size: 20px; font-weight: 900; color: #FFF; margin: 4px 0 6px 0; line-height: 1.3; } 
    .card-price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-price { color: var(--gold-bright); font-size: 22px; font-weight: 900; }

    /* Quantity Controls */
    .qty-control { display: flex; align-items: center; gap: 8px; background: #000; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--gold-bright); }
    .qty-btn { background: var(--red-bright); color: #fff; border: none; width: 36px; height: 36px; border-radius: 6px; font-size: 22px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn.plus { background: #00B300; }
    .qty-val { font-size: 20px; font-weight: 900; color: var(--gold-bright); min-width: 24px; text-align: center; }

    /* Cart Bar */
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 3px solid var(--gold-bright); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .cart-total-label { font-size: 19px; color: #FFF; font-weight: 900; }
    .cart-total-val { font-size: 26px; color: var(--gold-bright); font-weight: 900; }
    .btn-checkout { background: var(--red-bright); color: #FFF; border: 2px solid var(--gold-bright); padding: 12px 20px; border-radius: 8px; font-size: 18px; font-weight: 900; cursor: pointer; }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: flex-start; padding: 15px; overflow-y: auto; }
    .modal-body { background: #180304; border: 3px solid var(--gold-bright); border-radius: 12px; padding: 18px; width: 100%; max-width: 520px; margin-top: 15px; margin-bottom: 40px; }
    .modal-title { text-align: center; color: var(--gold-bright); font-size: 22px; font-weight: 900; margin-top: 0; border-bottom: 2px solid var(--gold-bright); padding-bottom: 8px; }

    label { font-size: 16px; font-weight: 700; color: var(--gold-bright); display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 12px; margin: 4px 0 8px 0; background: #000; border: 2px solid var(--gold-bright); color: #fff; border-radius: 6px; font-size: 17px; font-weight:bold; }

    .btn-action { width: 100%; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: 900; border: none; cursor: pointer; margin-top: 10px; color: #000; }
    .btn-preview { background: var(--btn-preview-grad); color: #FFF; } 
    .btn-print { background: var(--btn-print-grad); color: #000; font-weight: 900; }
    .btn-telegram { background: var(--btn-telegram-grad); color: #FFF; font-weight: 900; }
    .btn-close { background: #444; color: #FFF; margin-top: 8px; }

    .verification-box { background: #000; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1.5px solid var(--gold-bright); }
    .ver-title { font-size: 18px; font-weight: 900; color: var(--gold-bright); border-bottom: 1px dashed #444; padding-bottom: 4px; margin-bottom: 8px; text-align: center; }
    .promo-box { background: #2A1A00; border: 1px dashed var(--gold-bright); padding: 10px; margin-top: 8px; border-radius: 6px; color: var(--green-bright); font-size: 16px; font-weight: bold; line-height: 1.5; }

    /* 🧾 CSS រចនាបទវិក្កយបត្រ 55mm សម្រាប់ Preview & Print */
    .receipt-55mm {
      background: #ffffff;
      color: #000000;
      padding: 8px;
      border-radius: 6px;
      font-size: 11pt;
      line-height: 1.25;
      font-family: 'Kantumruy Pro', Arial, sans-serif;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
  </style>
</head>

    <div class="subtitle-2">ចេកបំពងស្រួយ BananaCrispy</div>

    function renderMenu() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      fullCatalog.forEach(sec => {
        let sectionHtml = `<div class="section-header">${sec.section}</div><div class="grid">`;
        sec.items.forEach(p => {
          const price = (mode === 'retail') ? p.r : p.w;
          const qty = cart[p.id] ? cart[p.id].qty : 0;

          sectionHtml += `
            <div class="card">
              <div class="card-info">
                <div class="card-category">${p.catName}</div>
                <div class="card-title">${p.sizeStr} - ${p.name}</div>

                </div>
              </div>
              <div class="qty-control">
                <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                <span class="qty-val" id="qty-${p.id}">${qty}</span>
                <button class="qty-btn plus" onclick="updateQty('${p.id}', 1)">+</button>
              </div>
            </div>`;
        });
        sectionHtml += `</div>`;
        container.innerHTML += sectionHtml;
      });
    }

    function updateQty(id, change) {
      let pObj = null;
      fullCatalog.forEach(sec => {
        sec.items.forEach(item => { if(item.id === id) pObj = item; });
      });

      if(!cart[id]) {
        cart[id] = { ...pObj, qty: 0 };
      }

      cart[id].qty += change;
      if (cart[id].qty <= 0) {
        delete cart[id];
      }

      const qtySpan = document.getElementById(`qty-${id}`);
      if(qtySpan) qtySpan.innerText = cart[id] ? cart[id].qty : 0;

      updateCartUI();
    }

    function updateCartUI() {
      let total = 0;
      Object.keys(cart).forEach(id => {
        const item = cart[id];
        const price = (mode === 'retail') ? item.r : item.w;
        total += price * item.qty;
      });
      document.getElementById('total-val').innerText = total.toLocaleString() + ' ៛';
    }

    function calculateOrderLogic() {
      let foodTotal = 0;
      let isFreeShipping = false;
      let deliveryFee = 8000;

      let totalPacksBought = 0;
      let totalKgBought = 0; 
      let totalBonusExtraPacks = 0;

      let damnab200Qty = 0;
      let damnabKgQty = 0;
      let crispy200Qty = 0;
      let crispy100Qty = 0;
      let choco300Qty = 0;

      let bonuses = [];

      Object.keys(cart).forEach(id => {
        const item = cart[id];
        const price = (mode === 'retail') ? item.r : item.w;
        foodTotal += price * item.qty;

        if (item.isKg) totalKgBought += item.qty;
        else totalPacksBought += item.qty;

        if (item.group === 'damnab200') damnab200Qty += item.qty;
        if (item.group === 'damnabKg') damnabKgQty += item.qty;
        if (item.group === 'crispy200') crispy200Qty += item.qty;
        if (item.group === 'crispy100') crispy100Qty += item.qty;
        if (item.group === 'choco300') choco300Qty += item.qty;
      });

      if (mode === 'retail') {
        if (damnabKgQty >= 1) {
          isFreeShipping = true;
          let bonusPacks = damnabKgQty;
          totalBonusExtraPacks += bonusPacks;
          bonuses.push(`🎁 ដំណាប់ចេក ${damnabKgQty}kg ➔ ថែម 200g ចំនួន ${bonusPacks} ប្រអប់ + 🚚 Free ដឹក`);
        }

        let totalCombo300 = damnab200Qty + choco300Qty;
        if (totalCombo300 >= 30) {
          isFreeShipping = true;
          let sets = Math.floor(totalCombo300 / 30);
          let extra = sets * 6;
          totalBonusExtraPacks += extra;
          bonuses.push(`🎁 កញ្ចប់ Promotion 30 ប្រអប់ ➔ ថែម ${extra} ប្រអប់ + 🚚 Free ដឹក`);
        } else if (damnab200Qty >= 5) {
          isFreeShipping = true;
          let sets = Math.floor(damnab200Qty / 5);
          let extra = sets * 1;
          totalBonusExtraPacks += extra;
          bonuses.push(`🎁 ដំណាប់ចេក 200g (${damnab200Qty} ប្រអប់) ➔ ថែម 200g ចំនួន ${extra} ប្រអប់ + 🚚 Free ដឹក`);
        }

        if (crispy200Qty >= 5 && crispy100Qty >= 10) {
          isFreeShipping = true;
          totalBonusExtraPacks += 1;
          bonuses.push(`🎁 ចេកបំពង (15 ប្រអប់) ➔ ថែម 100g ចំនួន 1 ប្រអប់ + 🚚 Free ដឹក`);
        } else if (crispy200Qty >= 5) {
          isFreeShipping = true;
          bonuses.push(`🎁 ចេកបំពង 200g (${crispy200Qty} ប្រអប់) ➔ 🚚 Free ដឹក`);
        } else if (crispy100Qty >= 10) {
          isFreeShipping = true;
          bonuses.push(`🎁 ចេកបំពង 100g (${crispy100Qty} ប្រអប់) ➔ 🚚 Free ដឹក`);
        }
      } else {
        if (damnab200Qty >= 30) {
          isFreeShipping = true;
          let sets = Math.floor(damnab200Qty / 30);
          let extra = sets * 6;
          totalBonusExtraPacks += extra;
          bonuses.push(`🎁 ដំណាប់ចេកបោះដុំ 200g (${damnab200Qty} ប្រអប់) ➔ ថែម 200g ចំនួន ${extra} ប្រអប់ + 🚚 Free ដឹក`);
        } else if (damnab200Qty >= 10) {
          let extra = Math.floor(damnab200Qty / 5) - 1;
          totalBonusExtraPacks += extra;
          bonuses.push(`🎁 ដំណាប់ចេកបោះដុំ 200g (${damnab200Qty} ប្រអប់) ➔ ថែម 200g ចំនួន ${extra} ប្រអប់ (សេវាដឹក 8,000៛)`);
        }

        if (totalKgBought >= 10) {
          isFreeShipping = true;
          bonuses.push(`🎁 ទិញដំណាប់ចេក 200g គ្រប់ 10kg ➔ 🚚 Free ដឹក`);
        }

        let totalCrispyMix = crispy200Qty + crispy100Qty;
        if (totalCrispyMix >= 60) {
          isFreeShipping = true;
          totalBonusExtraPacks += 1;
          bonuses.push(`🎁 លាយចេកបំពង 200g & 100g (60 ប្រអប់) ➔ ថែម 200g 1 ប្រអប់ + 🚚 Free ដឹក`);
        } else if (totalCrispyMix >= 30) {
          isFreeShipping = true;
          bonuses.push(`🎁 លាយចេកបំពង 200g & 100g (ចាប់ពី 30 ប្រអប់) ➔ 🚚 Free ដឹក`);
        }
      }

      if (isFreeShipping) deliveryFee = 0;
      let finalTotalPacks = totalPacksBought + totalBonusExtraPacks;

      return { foodTotal, deliveryFee, totalPacksBought, totalBonusExtraPacks, finalTotalPacks, totalKgBought, bonuses };
    }

                          `អ្នកទទួល៖ ${phone}\n` +
                          `ទីតាំង៖ ${addr}\n` +
                          `ដឹកជញ្ជូន៖ ${courier} (${branch})\n` +
                          `----------------------------\n` +
                          `បញ្ជីទំនិញ៖\n${itemsText}\n` +
                          `----------------------------\n` +
                          `Note សរុបទំនិញទាំងអស់៖\n✅ ${combinedStr}\n` +
                          `----------------------------\n` +
                          `ទឹកលុយសរុប៖ ${grandTotal.toLocaleString()} ៛\n` +
                          `----------------------------\n` +
                          `     ACLEDA KHQR\n` +
                          `   ID: 15198798`;

      navigator.clipboard.writeText(textToCopy).then(() => {
        alert("✅ បាន Copy ព័ត៌មានវិក្កយបត្ររួចរាល់! អ្នកអាចយកទៅ Paste ក្នុងកម្មវិធី PeriPage / RawBT ដើម្បី Print បានភ្លាមៗ។");
      });
    }

    renderMenu();
  </script>
